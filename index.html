<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d2a" />
    <meta
      name="description"
      content="A 3D naval duel: sail your sloop, drop anchor, load the cannons and take on an enemy captain in open water."
    />
    <title>Sea of Opus — A Sloop Duel</title>

    <!--
      Favicon embutido como SVG: um timão em latão sobre madeira. Data URI em vez de
      arquivo porque é a única forma de o projeto continuar sem nenhum asset binário
      — e porque um `/favicon.ico` faltando é um 404 no console a cada carregamento.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a1a10'/%3E%3Cg stroke='%23c9a227' stroke-width='2.4' fill='none'%3E%3Ccircle cx='16' cy='16' r='7.5'/%3E%3Cpath d='M16 3.5v25M3.5 16h25M7.2 7.2l17.6 17.6M24.8 7.2L7.2 24.8'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f0d478'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cinzel para o logotipo (capital romana lapidar) e IM Fell English para todo
      o resto. A IM Fell é uma digitalização dos tipos que a Oxford University
      Press usava no século XVII: ela carrega a irregularidade de tinta e a
      variação de traço de impressão em prensa, que é exatamente o registro de
      uma carta náutica da época. Uma serifa moderna e limpa no lugar dela
      deixaria a interface correta e sem lugar nenhum.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- O canvas WebGL é injetado aqui pelo Renderer. -->
    <div id="viewport" aria-hidden="true"></div>

    <!-- Camada de interface: menu, HUD e diálogos ficam sobre o canvas. -->
    <div id="ui-root"></div>

    <noscript>
      <p style="color: #e8d9b5; font-family: sans-serif; padding: 2rem">
        This game needs JavaScript and WebGL2 enabled to run.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
