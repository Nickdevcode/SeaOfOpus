<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d2a" />
    <meta
      name="description"
      content="A 3D naval duel: sail your sloop, drop anchor, load the cannons and take on an enemy captain in open water."
    />
    <title>Sea of Opus — A Sloop Duel</title>

    <!--
      Favicon embedded as SVG: a brass wheel over wood. A data URI instead of a file
      because it is the only way for the project to go on with no binary asset at all
      — and because a missing `/favicon.ico` is a 404 in the console on every load.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a1a10'/%3E%3Cg stroke='%23c9a227' stroke-width='2.4' fill='none'%3E%3Ccircle cx='16' cy='16' r='7.5'/%3E%3Cpath d='M16 3.5v25M3.5 16h25M7.2 7.2l17.6 17.6M24.8 7.2L7.2 24.8'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f0d478'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cinzel for the logo (Roman capitals cut for stone) and IM Fell English for
      everything else. IM Fell is a digitization of the types the Oxford University
      Press used in the seventeenth century: it carries the ink irregularity and the
      stroke variation of press printing, which is exactly the register of a nautical
      chart of the period. A clean modern serif in its place would leave the UI
      correct and from nowhere at all.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The WebGL canvas is injected here by the Renderer. -->
    <div id="viewport" aria-hidden="true"></div>

    <!-- UI layer: menu, HUD and dialogs sit on top of the canvas. -->
    <div id="ui-root"></div>

    <noscript>
      <p style="color: #e8d9b5; font-family: sans-serif; padding: 2rem">
        This game needs JavaScript and WebGL2 enabled to run.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
